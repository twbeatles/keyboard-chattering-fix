[package]
name = "kcfix-updater"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Self-update helper binary for Keyboard Chatter Fix"

[[bin]]
name = "kcfix-updater"
path = "src/main.rs"

[lib]
name = "kcfix_updater"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
hex = "0.4"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"
