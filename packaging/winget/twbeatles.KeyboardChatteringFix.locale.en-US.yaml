License: MIT
LicenseUrl: https://github.com/twbeatles/keyboard-chattering-fix/blob/main/LICENSE
ShortDescription: Stops keys and mouse buttons from registering twice (switch chatter).
Description: |-
  A lightweight Windows filter for mechanical keyboard and mouse-button chatter.
  Blocks a repeat of the same key inside a configurable window, suggests per-key
  thresholds from measured gaps, and can pause for games or full-screen apps.
