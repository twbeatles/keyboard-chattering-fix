name: release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

# Two rapid tags must not interleave asset uploads; the later run waits.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install "cryptography>=50"
      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $version = (Select-String -Path src/config.rs -Pattern 'pub const VERSION: &str = "([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME must match application version v$version" }
      - name: Test workspace gate
        # A tagged release must never ship code that fails the
        # contract/sync suite. windows-ci already runs this per-PR; the
        # tag pipeline re-runs it so a tag on an untested commit is blocked.
        run: cargo test --workspace
      - name: Build release executables
        shell: pwsh
        env:
          SIGN_PFX_PATH: ${{ secrets.SIGN_PFX_PATH }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
          SIGN_CERT_SHA1: ${{ secrets.SIGN_CERT_SHA1 }}
          SIGN_TIMESTAMP_URL: ${{ secrets.SIGN_TIMESTAMP_URL }}
        run: |
          # Sign only when a signing secret is configured; otherwise
          # keep today's unsigned (-NoSign) behavior.
          $signFlag = @()
          if (-not $env:SIGN_PFX_PATH -and -not $env:SIGN_CERT_SHA1) {
            $signFlag = @("-NoSign")
          }
          powershell -ExecutionPolicy Bypass -File .\scripts\build_release.ps1 @signFlag
      - name: Create signed update manifest
        shell: pwsh
        env:
          KCFIX_UPDATE_PRIVATE_KEY_B64: ${{ secrets.KCFIX_UPDATE_PRIVATE_KEY_B64 }}
        run: |
          python scripts/build_update_manifest.py `
            --version $env:GITHUB_REF_NAME `
            --tag $env:GITHUB_REF_NAME `
            --artifact dist/KeyboardChatteringFix.exe `
            --artifact-url "https://github.com/${{ github.repository }}/releases/download/$env:GITHUB_REF_NAME/KeyboardChatteringFix.exe" `
            --output dist/update.json
      - name: Verify manifest against the built executable
        # Before anything is public: the signed manifest must describe the
        # exact bytes about to be uploaded.
        shell: pwsh
        run: |
          python scripts/verify_update_manifest.py --manifest dist/update.json --expect-asset dist/KeyboardChatteringFix.exe
          if ($LASTEXITCODE -ne 0) { throw "manifest does not match dist/KeyboardChatteringFix.exe" }
      - name: Publish GitHub Release (draft, verify, then publish)
        # The release stays a draft while assets upload and are checked, so
        # `releases/latest/download/update.json` never 404s or points at a
        # half-uploaded release. Rerunning for the same tag is safe: a stale
        # draft is replaced, a published release only gets assets refreshed.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $tag = $env:GITHUB_REF_NAME
          $files = @("dist/KeyboardChatteringFix.exe", "dist/kcfix-updater.exe", "dist/KeyboardChatteringFix.zip", "dist/update.json")

          function Get-ReleaseByTag {
            $all = gh api "repos/$repo/releases?per_page=100" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "could not list releases" }
            $all | Where-Object { $_.tag_name -eq $tag } | Select-Object -First 1
          }

          $release = Get-ReleaseByTag
          if ($release -and $release.draft) {
            Write-Host "Removing stale draft release $($release.id)"
            gh api -X DELETE "repos/$repo/releases/$($release.id)"
            if ($LASTEXITCODE -ne 0) { throw "could not remove stale draft" }
            $release = $null
          }
          if ($release) {
            Write-Host "Release $tag is already public; refreshing assets"
            gh release upload $tag @files --clobber
            if ($LASTEXITCODE -ne 0) { throw "asset upload failed" }
          } else {
            gh release create $tag @files --draft --generate-notes --title $tag --verify-tag
            if ($LASTEXITCODE -ne 0) { throw "release create failed" }
          }

          # Every local file must be attached with the same size.
          $release = Get-ReleaseByTag
          foreach ($f in $files) {
            $name = Split-Path $f -Leaf
            $asset = $release.assets | Where-Object { $_.name -eq $name }
            if (-not $asset) { throw "asset $name is missing from release $tag" }
            if ($asset.size -ne (Get-Item $f).Length) { throw "asset $name size $($asset.size) != local $((Get-Item $f).Length)" }
          }
          if ($release.draft) {
            gh api -X PATCH "repos/$repo/releases/$($release.id)" -F draft=false -f make_latest=true | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "could not publish the draft release" }
            Write-Host "Published $tag"
          }
      - name: Verify published manifest asset
        shell: pwsh
        run: |
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:GITHUB_REF_NAME/update.json"
          $exeUrl = "https://github.com/${{ github.repository }}/releases/download/$env:GITHUB_REF_NAME/KeyboardChatteringFix.exe"
          # Right after publishing, the download CDN can lag by a few seconds.
          foreach ($attempt in 1..6) {
            try {
              Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile published-update.json
              Invoke-WebRequest -UseBasicParsing -Uri $exeUrl -OutFile published-app.exe
              break
            } catch {
              if ($attempt -eq 6) { throw }
              Start-Sleep -Seconds 10
            }
          }
          python scripts/verify_update_manifest.py --manifest published-update.json --expect-asset published-app.exe
          python -c "import json; d=json.load(open('published-update.json', encoding='utf-8')); assert d['payload']['tag']=='${{ github.ref_name }}'; assert d['payload']['artifact_url'].endswith('/${{ github.ref_name }}/KeyboardChatteringFix.exe')"
